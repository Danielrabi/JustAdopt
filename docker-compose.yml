services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password1
      MYSQL_DATABASE: dog_list
      MYSQL_USER: flask
      MYSQL_PASSWORD: flaskpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: flask-app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: flask
      DB_PASSWORD: flaskpass
      DB_NAME: dog_list
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  mysql_data:
