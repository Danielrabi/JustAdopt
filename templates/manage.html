<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Dogs</title>
</head>
<body>
    {% if error %}
    <div style="background-color: #fee; border: 1px solid #fcc; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
    <strong>⚠️ Error:</strong> {{ error }}
    </div>
    {% endif %}
    <h1>Add a New Dog</h1>
    <form method="post" enctype="multipart/form-data">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Breed:</label><br>
        <input type="text" name="breed" required><br><br>

        <label>Age:</label><br>
        <input type="number" name="age" required><br><br>

        <label>Image:</label><br>
        <input type="file" name="image" accept="image/*"><br><br>
        <button type="submit">Add Dog</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Back to Dog List</a>
</body>
</html>
