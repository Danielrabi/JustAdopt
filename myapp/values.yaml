#flask
flask:
  image: danielrabi/flaskapp:1.2.6
  replicaCount: 1
  serviceAccount:
    roleArn: ""
  service:
    type: ClusterIP
    port: 80
  containerPort: 5000
  resources: {
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  }
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
  readinessProbe:
    httpGet: 
      path: /readiness
      port: 5000
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 2
