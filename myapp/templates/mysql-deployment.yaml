apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.fullname" . }}-mysql
spec:
  replicas: {{ .Values.mysql.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "myapp.fullname" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "myapp.fullname" . }}-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - containerPort: {{ .Values.mysql.service.port }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "{{ .Values.mysql.auth.MYSQL_ROOT_PASSWORD}}"
            - name: MYSQL_DATABASE
              value: "{{ .Values.mysql.auth.MYSQL_DATABASE}}"
            - name: MYSQL_USER
              value: "{{ .Values.mysql.auth.MYSQL_USER}}"
            - name: MYSQL_PASSWORD
              value: "{{ .Values.mysql.auth.MYSQL_PASSWORD}}"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-initdb
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            {{- toYaml .Values.mysql.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.mysql.readinessProbe | nindent 12 }}
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: {{ include "myapp.fullname" . }}-mysql-pvc
        - name: mysql-initdb
          configMap:
            name: mysql-initdb