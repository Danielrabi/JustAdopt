apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-flask-service
spec:
  selector:
    app: {{ include "myapp.fullname" . }}-flask
  ports:
    - port: {{ .Values.flask.service.port }}
      targetPort: {{ .Values.flask.service.port }}
  type: {{ .Values.flask.service.type }}
  targetPort: {{ .Values.flask.service.targetPort }}