apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "myapp.fullname" . }}-ingress
  annotations:
    # This line increases the max upload size to 10 megabytes
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx 
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "myapp.fullname" . }}-flask-service
                port:
                  # This must match the port in your flask-service.yaml
                  number: {{ .Values.flask.service.port }} 