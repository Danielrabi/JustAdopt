apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath: # Works locally in Minikube
    path: /mnt/data/minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]  # Added console port
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001  # Console UI port (optional, for admin access)
              name: console
          env:
            - name: MINIO_ROOT_USER  # Changed from MINIO_ACCESS_KEY (deprecated)
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD  # Changed from MINIO_SECRET_KEY (deprecated)
              value: "minioadmin123"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:  # Added health check
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:  # Added readiness check
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      name: api
  type: ClusterIP